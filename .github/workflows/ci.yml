name: CI

on:
  push:
    branches: [main, android]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libgmp-dev libmpfr-dev libmpc-dev python3 python3-pip
          pip3 install --quiet --break-system-packages sympy mpmath
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          build/EasyMath --version
      - name: Full test suite
        run: bash tests/run_all.sh build/EasyMath
      - name: Check pi to 100 digits
        run: |
          build/EasyMath --eval pi --decimals 100 --hide all --show approx
          python3 -c "import re,subprocess,mpmath as mp; mp.mp.dps=200; out=subprocess.run(['build/EasyMath','--eval','pi','--decimals','100','--hide','all','--show','approx'],capture_output=True,text=True).stdout; d=max(re.findall(r'\d+\.(\d+)',out),key=len); err=abs(mp.mpf('3.'+d)-mp.pi); assert err<=mp.mpf('0.5e-100'), err; print('pi 100 digits OK, err=',err)"

  windows-build:
    name: Windows cross build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++-mingw-w64-x86-64
      - name: Cross compile
        run: |
          cmake -S . -B build-win -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build build-win -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: EasyMath-windows
          path: build-win/EasyMath.exe
          if-no-files-found: error

  android-apk:
    name: Android APK (best effort)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EasyMath-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
